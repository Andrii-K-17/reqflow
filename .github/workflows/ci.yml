name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: reqflow
          POSTGRES_PASSWORD: reqflow
          POSTGRES_DB: reqflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reqflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy type check
        run: uv run mypy app

      - name: Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://reqflow:reqflow@localhost:5432/reqflow
          JWT_SECRET: test-secret
        run: uv run pytest --cov=app

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm test run
