name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reqflow
          POSTGRES_PASSWORD: reqflow
          POSTGRES_DB: reqflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reqflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Mypy
        run: mypy app
      - name: Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://reqflow:reqflow@localhost:5432/reqflow
          JWT_SECRET: test-secret
        run: pytest --cov=app

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm lint
      - run: vue-tsc -b --noEmit
      - run: pnpm test -- --run
