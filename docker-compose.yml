services:
  postgres:
    image: postgres:18-alpine
    container_name: reqflow-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_USER}
    ports:
      - "5432:5432"
    volumes:
      - reqflow_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  reqflow_pg_data:
